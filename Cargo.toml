[package]
name = "flutter-network-viewer"
version = "1.0.4"
edition = "2024"
description = "Rust port of Flutter Network Viewer"
publish = false
license = "GPL-3.0-only"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

regress = { version = "0.12", features = ["utf16"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

url = "2"
base64 = "0.22"
tungstenite = { version = "0.29", features = ["native-tls"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dev-dependencies]
arboard = "3.7"
