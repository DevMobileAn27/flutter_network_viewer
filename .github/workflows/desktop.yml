name: Desktop checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - if: matrix.target == 'macos'
        run: bash tool/build_macos.sh
      - if: matrix.target == 'windows'
        run: flutter build windows --release
      - if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Flutter Network Viewer.app" build/flutter-network-viewer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-network-viewer-${{ matrix.target }}
          path: |
            build/flutter-network-viewer-macos.zip
            build/windows/x64/runner/Release/
