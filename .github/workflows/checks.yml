name: Rust checks and local packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - run: cargo test --locked --offline
      - run: python -B tools/test_f21_release.py
      - run: python -B tools/verify_updater_vendor.py
      - if: runner.os == 'macOS'
        run: |
          python3 -B tools/test_f20_integrity.py
          python3 -B tools/test_f21_signer.py
      - name: Fake VM full flow, combined discovery and native regressions
        if: runner.os == 'macOS'
        env:
          FNV_DIAGNOSTICS_DIR: ${{ github.workspace }}/docs/artifacts/f21/ci-diagnostics
        run: |
          python3 -B tools/f21_native_smoke.py docs/artifacts/f21/ci-native
          python3 -B tools/f21_multiapp.py docs/artifacts/f21/ci-multiapp
          python3 -B tools/f17_native_smoke.py docs/artifacts/f21/ci-f17
          python3 -B tools/f19_native_smoke.py docs/artifacts/f21/ci-f19
          python3 -B tools/f20_native_smoke.py docs/artifacts/f21/ci-f20
      - name: Package Rust preview
        id: package
        shell: bash
        run: |
          python -B tools/release.py package ${{ matrix.platform }}
          cat dist/actions-output.txt >> "$GITHUB_OUTPUT"
      - name: Build Windows installer (never install)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FNV_VERSION: ${{ steps.package.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:FNV_VERSION" "/DOutputName=flutter-network-viewer-rust-$($env:FNV_VERSION)-windows-x64-setup" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -B tools/release.py manifest dist
      - run: python -B tools/release.py verify dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rust-preview-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/SHA256SUMS.txt
            dist/*-status.json
            dist/release-notes.md
          if-no-files-found: error
