name: Rust checks, packages and draft release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - run: cargo test --locked --offline --no-fail-fast
        env:
          RUST_BACKTRACE: '1'
      - name: F19 input under slow render frames
        run: cargo test --locked --offline --example f19_native_smoke
      - run: python -B tools/test_f21_release.py
      - run: python -B tools/test_draft_release.py
      - run: python -B tools/verify_updater_vendor.py
      - if: runner.os == 'macOS'
        run: |
          python3 -B tools/test_f20_integrity.py
          python3 -B tools/test_f21_signer.py
      - name: Native F21 capture, clipboard, MCP and export
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          FNV_DIAGNOSTICS_DIR: ${{ github.workspace }}/docs/artifacts/f21/ci-diagnostics
        run: python3 -B tools/f21_native_smoke.py docs/artifacts/f21/ci-native
      - name: F21 combined discovery and multiple apps
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 -B tools/f21_multiapp.py docs/artifacts/f21/ci-multiapp
      - name: Native F17 help and settings
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 -B tools/f17_native_smoke.py docs/artifacts/f21/ci-f17
      - name: Native F19 diagnostics and memory
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 -B tools/f19_native_smoke.py docs/artifacts/f21/ci-f19
      - name: Native F20 Sparkle callbacks and process exit
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 -B tools/f20_native_smoke.py docs/artifacts/f21/ci-f20
      - name: Package Rust preview
        id: package
        # Keep the runner's native shell: Git Bash puts its link.exe before MSVC.
        # Python appends step outputs so this command is identical on both OSes.
        run: python -B tools/release.py package ${{ matrix.platform }} --github-output
      - name: Build Windows installer (never install)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FNV_VERSION: ${{ steps.package.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:FNV_VERSION" "/DOutputName=flutter-network-viewer-rust-$($env:FNV_VERSION)-windows-x64-setup" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign macOS archive for the Flutter updater
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'macOS'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.MACOS_UPDATE_PRIVATE_KEY }}
          FNV_VERSION: ${{ steps.package.outputs.version }}
          FNV_PLATFORM: ${{ matrix.platform }}
        run: python3 -B tools/release.py feed "$FNV_PLATFORM" "dist/flutter-network-viewer-rust-${FNV_VERSION}-${FNV_PLATFORM}.zip" --legacy
      - name: Sign Windows installer for the Flutter updater
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.os == 'Windows'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.WINDOWS_UPDATE_PRIVATE_KEY }}
          FNV_VERSION: ${{ steps.package.outputs.version }}
        run: python -B tools/release.py feed windows-x64 "dist/flutter-network-viewer-rust-${env:FNV_VERSION}-windows-x64-setup.exe" --legacy
      - run: python -B tools/release.py manifest dist
      - run: python -B tools/release.py verify dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rust-preview-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/appcast-*.xml
            dist/*.sha256
            dist/SHA256SUMS.txt
            dist/*-status.json
            dist/release-notes.md
          if-no-files-found: error
      - name: Upload native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            docs/artifacts/f21/ci-*/*.json
            docs/artifacts/f21/ci-*/*.png
            docs/artifacts/f21/ci-*/*.txt
            docs/artifacts/f21/ci-*/diagnostics/*.log
          if-no-files-found: ignore
  draft-release:
    name: Create or update draft release
    needs: desktop
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: rust-draft-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-preview-*
          path: release-artifacts
      - name: Verify packages and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/draft_release.py release-artifacts
