name: Check pull request
run-name: 'Check PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}'

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release metadata validation
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
